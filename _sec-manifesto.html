    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Anton&family=Manrope:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@1,500;1,600&family=Poppins:wght@500;600;700&family=Space+Mono:wght@400;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --pink: #f4167c;
            --purple: #4b16e8;
            --grad: linear-gradient(135deg, #f4167c 0%, #4b16e8 100%);
            --ink: #17122a;
            --muted: #6f6a7a;
            --paper: #f8f6fa;
            --white: #ffffff;
            --blush: #f9cfe4;
            --lilac: #e6dcfd;
            --disc: linear-gradient(150deg, #f9a9cf 0%, #e59ae2 48%, #b98cf7 100%);
            --line: rgba(23, 18, 38, .10);

            --display: 'Anton', Impact, sans-serif;
            --serif: 'Playfair Display', Georgia, serif;
            --body: 'Manrope', system-ui, sans-serif;
            --statement: 'Poppins', var(--body);
            --mono: 'Space Mono', ui-monospace, monospace;

            --gutter: clamp(20px, 5vw, 48px);
            --maxw: 1180px;
            --r-lg: 28px;
            --r-md: 18px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box
        }

        html {
            scroll-behavior: smooth
        }

        section[id] {
            scroll-margin-top: 92px
        }

        body {
            font-family: var(--body);
            color: var(--ink);
            background: var(--paper);
            line-height: 1.65;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        img {
            display: block;
            max-width: 100%
        }

        a {
            color: inherit
        }

        ::selection {
            background: var(--blush)
        }

        .wrap {
            max-width: var(--maxw);
            margin: 0 auto;
            padding: 0 var(--gutter)
        }

        /* ---------- type ---------- */
        .display {
            font-family: var(--display);
            font-weight: 400;
            text-transform: uppercase;
            line-height: .92;
            letter-spacing: .005em;
        }

        .display em {
            font-family: var(--serif);
            font-style: italic;
            text-transform: none;
            letter-spacing: -.01em;
            font-weight: 600;
        }

        .grad-text {
            background: var(--grad);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        /* sentence-case display voice — the deck's geometric sans */
        .statement {
            font-family: var(--statement);
            font-weight: 600;
            text-transform: none;
            line-height: 1.08;
            letter-spacing: -.028em;
        }

        .statement em {
            font-family: var(--serif);
            font-style: italic;
            font-weight: 600;
            letter-spacing: -.01em
        }

        .rule {
            display: block;
            width: 74px;
            height: 4px;
            border-radius: 99px;
            background: var(--grad);
            border: 0;
        }

        .arc {
            position: absolute;
            z-index: 0;
            pointer-events: none;
            opacity: .5
        }

        .arc--tr {
            transform: scaleX(-1)
        }

        .arc--br {
            transform: scale(-1, -1)
        }

        .label {
            font-family: var(--mono);
            font-size: 11.5px;
            letter-spacing: .16em;
            color: var(--muted);
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .label::before {
            content: "";
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--grad);
            flex: none;
        }

        .lead {
            font-size: clamp(1.05rem, 1.6vw, 1.3rem);
            color: var(--muted);
            max-width: 52ch
        }

        /* ---------- intersection system ---------- */
        .x {
            position: relative;
            isolation: isolate;
            display: inline-block;
            max-width: 100%
        }

        .x__blob {
            position: absolute;
            z-index: 0;
            width: 64%;
            aspect-ratio: 1;
            border-radius: 50%;
            background: var(--disc);
        }

        .b-bl {
            left: -6%;
            bottom: -4%
        }

        .b-lg {
            width: 84%
        }

        /* thin gradient stroke: passes behind the athlete and runs past the edges */
        .x__poly {
            position: absolute;
            z-index: 1;
            overflow: visible;
            pointer-events: none;
            top: -12%;
            left: -20%;
            width: 140%;
            height: 116%
        }

        .xt {
            transform: scaleX(-1)
        }

        /* the athlete: cut out, no frame, no matte — standing on the page */
        .x__cut {
            position: relative;
            z-index: 2;
            display: block;
            height: var(--h, 360px);
            width: auto;
            max-width: 100%;
            filter: drop-shadow(0 20px 24px rgba(75, 22, 232, .18));
        }

        /* the only exception: the room keeps its rectangle */
        .x__photo {
            position: relative;
            z-index: 2;
            display: block;
            width: 100%;
            height: auto;
            border-radius: var(--r-md);
        }

        /* deck artwork used as-is: its white ground disappears on a white band,
       so the disc and the stroke inside the file are the intersection */
        .x__flat {
            position: relative;
            z-index: 2;
            display: block;
            height: var(--h, 360px);
            width: auto;
            max-width: 100%;
        }

        /* ---------- header ---------- */
        header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 60;
            transition: background .3s, box-shadow .3s, border-color .3s;
            border-bottom: 1px solid transparent;
        }

        header.is-stuck {
            background: rgba(251, 247, 249, .82);
            backdrop-filter: blur(14px);
            border-bottom-color: var(--line);
        }

        .nav {
            max-width: var(--maxw);
            margin: 0 auto;
            padding: 14px var(--gutter);
            display: flex;
            align-items: center;
            gap: 24px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 11px;
            text-decoration: none;
            flex: none
        }

        .brand__logo {
            height: 44px;
            width: auto;
            display: block
        }

        .nav__links {
            display: flex;
            gap: 22px;
            margin-left: auto
        }

        .nav__links a {
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: .02em;
            color: var(--ink);
            opacity: .75;
            transition: opacity .2s;
        }

        .nav__links a:hover {
            opacity: 1
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-family: var(--mono);
            font-size: 12px;
            font-weight: 700;
            letter-spacing: .06em;
            padding: 15px 26px;
            border-radius: 999px;
            text-decoration: none;
            border: 1.5px solid transparent;
            background: linear-gradient(var(--white), var(--white)) padding-box, var(--grad) border-box;
            color: var(--ink);
            transition: transform .25s cubic-bezier(.2, .8, .2, 1), box-shadow .25s, background .25s, color .25s;
            cursor: pointer;
        }

        .btn:hover {
            transform: translate(-2px, -2px);
            box-shadow: 4px 4px 0 0 var(--blush)
        }

        .btn--grad {
            background: var(--grad);
            border-color: transparent;
            color: #fff
        }

        .btn--grad:hover {
            box-shadow: 4px 4px 0 0 var(--lilac)
        }

        .btn--sm {
            padding: 11px 18px;
            font-size: 11px
        }

        /* ---------- hero ---------- */
        .hero {
            min-height: 100svh;
            display: flex;
            align-items: center;
            padding: 132px 0 48px;
            position: relative;
            overflow: clip
        }

        .hero__grid {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            gap: 0;
            align-items: center;
            width: 100%;
            max-width: none;
            padding-left: clamp(24px, 4vw, 72px);
            padding-right: clamp(24px, 12vw, 240px);
        }

        .hero__copy {
            position: relative;
            z-index: 3;
            max-width: 580px
        }

        .hero h1 {
            font-size: clamp(3rem, 7.6vw, 6.9rem);
            margin: 22px 0 20px
        }

        .hero__sub {
            font-family: var(--statement);
            font-weight: 600;
            font-size: clamp(1.3rem, 2.6vw, 1.9rem);
            line-height: 1.12;
            letter-spacing: -.025em
        }

        .hero p.lead {
            margin: 18px 0 30px;
            max-width: 44ch
        }

        .hero__cta {
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
            align-items: center
        }

        .hero__proof {
            margin-top: 34px;
            padding-top: 20px;
            border-top: 1px solid var(--line);
            display: flex;
            flex-wrap: wrap;
            gap: 8px 18px;
            align-items: center;
            font-family: var(--mono);
            font-size: 12px;
            color: var(--muted);
        }

        .hero__proof b {
            color: var(--ink);
            font-weight: 700
        }

        .hero__media {
            position: relative;
            z-index: 1;
            display: flex;
            justify-content: flex-end;
            align-items: flex-end;
            margin-left: clamp(-160px, -7vw, -24px);
            margin-right: clamp(-40px, -1.5vw, -8px)
        }

        .hero .x__cut {
            --h: clamp(560px, 88vh, 1000px)
        }

        .hero .x__blob {
            width: 148%;
            right: -32%;
            bottom: -2%
        }

        .hero .x__poly {
            top: -2%;
            left: -46%;
            width: 192%;
            height: 104%
        }

        /* ---------- marquee ---------- */
        .marquee {
            border-top: 1px solid var(--line);
            border-bottom: 1px solid var(--line);
            background: var(--white);
            overflow: hidden;
            padding: 16px 0;
        }

        .marquee__track {
            display: flex;
            align-items: center;
            width: max-content;
            animation: slide 34s linear infinite;
            will-change: transform
        }

        .marquee__group {
            display: flex;
            align-items: center;
            gap: 26px;
            padding-right: 26px;
            flex: none
        }

        .marquee span {
            font-family: var(--statement);
            font-weight: 700;
            font-size: clamp(1rem, 2vw, 1.45rem);
            letter-spacing: -.01em;
            white-space: nowrap
        }

        .marquee i {
            font-family: var(--serif);
            font-style: italic;
            color: var(--pink)
        }

        .marquee__dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: var(--grad);
            flex: none
        }

        @keyframes slide {
            to {
                transform: translateX(-50%)
            }
        }

        /* ---------- section shell ---------- */
        section {
            position: relative
        }

        .band {
            padding: clamp(70px, 9vw, 120px) 0;
            overflow: clip
        }

        .band--white {
            background: var(--white)
        }

        .band--blush {
            background: linear-gradient(180deg, #fff 0%, var(--blush) 100%)
        }

        .ghost {
            position: absolute;
            z-index: 0;
            pointer-events: none;
            font-family: var(--display);
            font-size: clamp(9rem, 26vw, 22rem);
            line-height: .8;
            color: var(--purple);
            opacity: .07;
            top: -.1em;
            left: -.04em;
        }

        .band__head {
            position: relative;
            z-index: 1;
            max-width: 62ch;
            margin-bottom: clamp(34px, 5vw, 56px)
        }

        .band__head h2 {
            font-size: clamp(2.1rem, 5.2vw, 3.9rem);
            margin: 16px 0 14px
        }

        /* ---------- manifesto ---------- */
        .manifesto .statement {
            font-size: clamp(1.9rem, 4.3vw, 3.2rem);
            max-width: 24ch;
        }

        .manifesto .statement .grad-text {
            display: block
        }

        .manifesto .rule {
            margin: 26px 0 0
        }

        .manifesto__note {
            margin-top: 26px;
            font-family: var(--body);
            font-size: 1.05rem;
            color: var(--muted);
            max-width: 52ch;
            line-height: 1.7;
        }

        .manifesto__note em {
            font-family: var(--serif);
            font-weight: 600;
            color: var(--pink)
        }

        /* manifesto: bloco de texto a esquerda, as quatro composicoes a direita */
        .mf {
            display: grid;
            grid-template-columns: 1.04fr .96fr;
            gap: clamp(28px, 4.6vw, 64px);
            align-items: center;
            position: relative;
            z-index: 1;
        }

        .mf__strip {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: clamp(6px, 1.2vw, 18px);
            height: clamp(320px, 31vw, 440px);
        }

        .mf__strip figure {
            margin: 0;
            height: 100%;
            display: flex;
            align-items: flex-end;
            justify-content: center;
        }

        .mf__strip img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
            object-position: center bottom;
        }

        /* ---------- pillars ---------- */
        .pillars {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: clamp(16px, 2.4vw, 28px);
            position: relative;
            z-index: 1
        }

        .pillar {
            background: var(--white);
            border: 1px solid var(--line);
            border-radius: var(--r-lg);
            padding: 30px 28px 34px;
            position: relative;
            overflow: hidden;
            isolation: isolate;
            transition: transform .35s cubic-bezier(.2, .8, .2, 1), box-shadow .35s, border-color .35s;
        }

        .pillar:hover {
            transform: translateY(-8px);
            box-shadow: 0 30px 60px -34px rgba(23, 18, 38, .4);
            border-color: transparent
        }

        .pillar__n {
            font-family: var(--mono);
            font-size: 11px;
            letter-spacing: .2em;
            color: var(--muted);
            display: block;
            margin-bottom: 18px;
        }

        .pillar__mark {
            display: block;
            width: 46px;
            height: 46px;
            border-radius: 50%;
            background: var(--grad);
            margin-bottom: 18px;
            position: relative;
        }

        .pillar__mark::after {
            content: "";
            position: absolute;
            inset: -9px;
            border-radius: 50%;
            border: 1.5px solid var(--pink);
            opacity: .5;
        }

        .pillar h3 {
            font-family: var(--statement);
            font-weight: 600;
            font-size: 1.45rem;
            letter-spacing: -.02em;
            margin-bottom: 10px
        }

        .pillar p {
            font-size: .98rem;
            color: var(--muted)
        }

        .pillar__blob {
            position: absolute;
            width: 230px;
            height: 230px;
            border-radius: 50%;
            background: var(--disc);
            right: -90px;
            bottom: -110px;
            z-index: 0;
            opacity: .5;
        }

        .pillar>* {
            position: relative;
            z-index: 1
        }

        .pillar__fig {
            margin: -30px -28px 22px;
            height: clamp(180px, 19vw, 232px);
            overflow: hidden;
            background: var(--white);
            border-bottom: 1px solid var(--line);
        }

        .pillar__fig img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: var(--pos, 50% 30%);
            transition: transform .6s cubic-bezier(.2, .8, .2, 1);
        }

        .pillar:hover .pillar__fig img {
            transform: translateY(-5px) scale(1.02)
        }

        /* ---------- CT ---------- */
        .split {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: clamp(28px, 5vw, 72px);
            align-items: center;
            position: relative;
            z-index: 1
        }

        .split h2 {
            font-size: clamp(2rem, 4.6vw, 3.4rem);
            margin: 16px 0 8px
        }

        .split h3 {
            font-family: var(--serif);
            font-style: italic;
            font-weight: 600;
            font-size: clamp(1.2rem, 2.4vw, 1.6rem);
            color: var(--purple);
            margin-bottom: 20px;
            text-transform: none
        }

        .split p {
            color: var(--muted);
            margin-bottom: 16px
        }

        .info-card {
            margin-top: 26px;
            border: 1px solid var(--line);
            border-radius: var(--r-md);
            background: var(--white);
            padding: 22px 24px;
        }

        .info-card .label {
            margin-bottom: 10px
        }

        .info-card address {
            font-style: normal;
            font-weight: 600;
            line-height: 1.5
        }

        .info-card a {
            font-family: var(--mono);
            font-size: 12px;
            letter-spacing: .08em;
            text-decoration: none;
            border-bottom: 1px solid var(--pink)
        }

        .ct__stack {
            position: relative;
            isolation: isolate
        }

        .ct__stack .x {
            display: block;
            width: 100%
        }

        .ct__detail {
            position: absolute;
            z-index: 3;
            right: -5%;
            bottom: -9%;
            width: 46%;
            border-radius: var(--r-md);
            overflow: hidden;
            border: 6px solid var(--white);
            box-shadow: 0 26px 50px -30px rgba(23, 18, 38, .55);
            transform: rotate(-3deg);
        }

        .ct__detail img {
            display: block;
            width: 100%;
            height: auto
        }

        .ct__athlete {
            position: absolute;
            z-index: 3;
            left: -6%;
            bottom: -11%;
            height: auto;
            width: 46%;
            max-width: none;
            filter: drop-shadow(0 22px 26px rgba(75, 22, 232, .22));
        }

        /* ---------- founders ---------- */
        .founders {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: clamp(20px, 3vw, 40px);
            position: relative;
            z-index: 1
        }

        .founder {
            text-align: left
        }

        .founder .x {
            display: block;
            max-width: fit-content;
            margin: 0 auto
        }

        .founder .x__cut {
            --h: clamp(270px, 29vh, 380px)
        }

        .founder .x__blob {
            width: 88%;
            left: -16%;
            bottom: -2%
        }

        .founder .x__poly {
            top: -10%;
            left: -28%;
            width: 156%;
            height: 112%
        }

        .founder h3 {
            font-family: var(--statement);
            font-weight: 600;
            font-size: 1.4rem;
            margin: 22px 0 4px;
            letter-spacing: -.02em
        }

        .founder .role {
            font-family: var(--mono);
            font-size: 11px;
            color: var(--pink);
            display: block;
            margin-bottom: 12px
        }

        .founder p {
            font-size: .93rem;
            color: var(--muted)
        }

        .founder__ig {
            display: inline-block;
            margin-top: 14px;
            font-family: var(--mono);
            font-size: 11px;
            letter-spacing: .12em;
            text-decoration: none;
            color: var(--purple);
            border-bottom: 1.5px solid var(--blush);
            padding-bottom: 2px;
            transition: border-color .25s;
        }

        .founder__ig:hover {
            border-bottom-color: var(--pink)
        }

        /* ---------- faq ---------- */
        .faq {
            position: relative;
            z-index: 1;
            max-width: 820px;
            margin: 0 auto;
            border-top: 1px solid var(--line)
        }

        .qa {
            border-bottom: 1px solid var(--line)
        }

        .qa__q {
            width: 100%;
            background: none;
            border: 0;
            cursor: pointer;
            text-align: left;
            padding: 22px 44px 22px 0;
            position: relative;
            font-family: var(--body);
            font-weight: 700;
            font-size: 1.05rem;
            color: var(--ink);
        }

        .qa__q::after {
            content: "+";
            position: absolute;
            right: 6px;
            top: 50%;
            transform: translateY(-50%);
            font-family: var(--display);
            font-size: 1.5rem;
            color: var(--purple);
            transition: transform .3s;
        }

        .qa.is-open .qa__q::after {
            transform: translateY(-50%) rotate(45deg)
        }

        .qa__a {
            display: grid;
            grid-template-rows: 0fr;
            transition: grid-template-rows .35s ease;
        }

        .qa.is-open .qa__a {
            grid-template-rows: 1fr
        }

        .qa__a>div {
            overflow: hidden
        }

        .qa__a p {
            padding: 0 40px 24px 0;
            color: var(--muted)
        }

        .qa__a p a {
            color: var(--purple);
            text-decoration: underline;
            text-underline-offset: 3px
        }

        /* ---------- final cta ---------- */
        .final {
            background: var(--grad);
            color: #fff;
            overflow: hidden;
            position: relative
        }

        .final__inner {
            position: relative;
            z-index: 2;
            padding: clamp(64px, 9vw, 110px) 0;
            text-align: center
        }

        .final h2 {
            font-family: var(--statement);
            font-weight: 700;
            font-size: clamp(2.1rem, 6vw, 4.2rem);
            line-height: 1;
            letter-spacing: -.035em
        }

        .final p {
            max-width: 46ch;
            margin: 18px auto 32px;
            color: rgba(255, 255, 255, .88)
        }

        .final .label::before {
            background: var(--white)
        }

        .final .btn {
            background: var(--white);
            color: var(--ink);
            border-color: transparent
        }

        .final .btn:hover {
            box-shadow: 4px 4px 0 0 rgba(255, 255, 255, .45)
        }

        .final__ring {
            position: absolute;
            border-radius: 50%;
            border: 1.5px solid rgba(255, 255, 255, .4);
            z-index: 1;
        }

        /* ---------- signature / footer ---------- */
        .site-footer {
            position: relative;
            background: var(--white);
            color: var(--ink);
            padding: clamp(56px, 7vw, 92px) 0 34px;
            overflow: clip;
            border-top: 1px solid var(--line);
        }

        .sig {
            position: relative;
            z-index: 2;
            display: grid;
            grid-template-columns: 1.05fr .95fr;
            gap: clamp(30px, 5vw, 64px);
            align-items: start;
        }

        .sig__logo {
            width: 132px;
            height: auto;
            display: block
        }

        .sig .rule {
            margin: 22px 0 20px
        }

        .sig__tag {
            font-family: var(--statement);
            font-weight: 600;
            font-size: clamp(1.35rem, 2.9vw, 2rem);
            line-height: 1.15;
            letter-spacing: -.02em;
            max-width: 22ch;
        }

        .sig__tag span {
            background: var(--grad);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent
        }

        .sig__sub {
            margin-top: 16px;
            color: var(--muted);
            font-size: .95rem;
            max-width: 38ch
        }

        .sig__contact {
            display: grid;
            gap: 2px
        }

        .sig__row {
            display: grid;
            grid-template-columns: 132px 1fr;
            gap: 14px;
            align-items: baseline;
            padding: 18px 0;
            border-bottom: 1px solid var(--line);
        }

        .sig__row:first-child {
            border-top: 1px solid var(--line)
        }

        .sig__row dt {
            font-family: var(--mono);
            font-size: 11px;
            letter-spacing: .12em;
            color: var(--muted);
        }

        .sig__row dd a {
            font-family: var(--statement);
            font-weight: 600;
            font-size: clamp(1.05rem, 2.1vw, 1.4rem);
            letter-spacing: -.01em;
            text-decoration: none;
            color: var(--ink);
            background-image: var(--grad);
            background-repeat: no-repeat;
            background-position: 0 100%;
            background-size: 100% 1.5px;
            transition: background-size .3s cubic-bezier(.2, .8, .2, 1);
        }

        .sig__row dd a:hover {
            background-size: 100% 6px
        }

        .foot__arc {
            width: 340px;
            height: 340px;
            right: -90px;
            bottom: -70px;
            opacity: .4
        }

        .legal {
            position: relative;
            z-index: 2;
            margin-top: 44px;
            padding-top: 22px;
            border-top: 1px solid var(--line);
            display: flex;
            flex-wrap: wrap;
            gap: 10px 24px;
            justify-content: space-between;
            font-family: var(--mono);
            font-size: 11px;
            color: var(--muted);
        }

        /* ---------- mobile sticky cta ---------- */
        .sticky-cta {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 70;
            display: none;
            padding: 12px var(--gutter);
            background: rgba(251, 247, 249, .9);
            backdrop-filter: blur(12px);
            border-top: 1px solid var(--line);
        }

        .sticky-cta .btn {
            width: 100%
        }

        /* ---------- reveal ---------- */
        .js .rv {
            opacity: 0;
            transform: translateY(26px);
            transition: opacity .7s cubic-bezier(.2, .8, .2, 1), transform .7s cubic-bezier(.2, .8, .2, 1)
        }

        .js .rv.is-in {
            opacity: 1;
            transform: none
        }

        .rv[data-d="1"] {
            transition-delay: .08s
        }

        .rv[data-d="2"] {
            transition-delay: .16s
        }

        .rv[data-d="3"] {
            transition-delay: .24s
        }

        .rv[data-d="4"] {
            transition-delay: .32s
        }

        /* ---------- reel de fotos (na quadra) ---------- */
        .reel {
            position: relative;
            margin-top: clamp(34px, 5vw, 56px);
            padding: clamp(30px, 4vw, 48px) 0;
            overflow: hidden;
            z-index: 1
        }

        .reel__disc {
            position: absolute;
            z-index: 0;
            width: clamp(320px, 40vw, 620px);
            aspect-ratio: 1;
            border-radius: 50%;
            background: var(--disc);
            left: 4%;
            top: 50%;
            transform: translateY(-50%);
            opacity: .9
        }

        .reel__line {
            position: absolute;
            z-index: 0;
            left: -5%;
            right: -5%;
            top: 50%;
            height: 1px;
            background: var(--grad);
            opacity: .5
        }

        .reel__arc {
            position: absolute;
            z-index: 0;
            right: 2%;
            top: -6%;
            width: 230px;
            height: 230px;
            opacity: .5;
            transform: rotate(12deg)
        }

        .reel__track {
            position: relative;
            z-index: 1;
            display: flex;
            width: max-content;
            animation: reel 104s linear infinite
        }

        .reel:hover .reel__track,
        .reel:focus-within .reel__track {
            animation-play-state: paused
        }

        .reel__group {
            display: flex;
            align-items: center;
            gap: clamp(10px, 1.4vw, 18px);
            padding-right: clamp(10px, 1.4vw, 18px)
        }

        .reel__item {
            position: relative;
            flex: none;
            width: clamp(168px, 18vw, 258px);
            aspect-ratio: 4 / 5;
            border: 0;
            padding: 0;
            border-radius: var(--r-md);
            overflow: hidden;
            background: var(--lilac);
            cursor: zoom-in;
            isolation: isolate
        }

        .reel__item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center 32%;
            transition: transform .6s cubic-bezier(.2, .8, .2, 1)
        }

        .reel__item::after {
            content: "";
            position: absolute;
            inset: 0;
            z-index: 1;
            background: linear-gradient(160deg, rgba(244, 22, 124, .55), rgba(75, 22, 232, .55));
            opacity: 0;
            transition: opacity .3s;
            pointer-events: none
        }

        .reel__item:hover img,
        .reel__item:focus-visible img {
            transform: scale(1.06)
        }

        .reel__item:hover::after,
        .reel__item:focus-visible::after {
            opacity: .55
        }

        .reel__item:focus-visible {
            outline: 3px solid var(--pink);
            outline-offset: 3px
        }

        @keyframes reel {
            to {
                transform: translateX(-50%)
            }
        }

        /* ---------- vídeo (dentro do ct) ---------- */
        .band--dark {
            background: var(--ink);
            color: #fff
        }

        .band--dark .label {
            color: rgba(255, 255, 255, .72)
        }

        .band--dark .statement {
            color: #fff
        }

        .band--dark .lead {
            color: rgba(255, 255, 255, .72)
        }

        .band--dark .ghost {
            color: rgba(255, 255, 255, .07)
        }

        .vid {
            position: relative;
            z-index: 1;
            display: flex;
            justify-content: center;
            margin-top: clamp(8px, 2vw, 22px)
        }

        .vid__frame {
            position: relative;
            width: min(400px, 86vw);
            border-radius: var(--r-lg);
            overflow: hidden;
            background: #000;
            box-shadow: 0 40px 90px -36px rgba(0, 0, 0, .65)
        }

        .vid video {
            display: block;
            width: 100%;
            aspect-ratio: 9 / 16;
            object-fit: cover
        }

        .vid__disc {
            position: absolute;
            z-index: 0;
            width: clamp(300px, 34vw, 520px);
            aspect-ratio: 1;
            border-radius: 50%;
            background: var(--disc);
            right: 6%;
            top: 50%;
            transform: translateY(-50%);
            opacity: .85
        }

        .vid__arc {
            position: absolute;
            z-index: 0;
            left: 3%;
            bottom: -4%;
            width: 220px;
            height: 220px;
            opacity: .55;
            transform: rotate(-24deg)
        }

        .vid__tag {
            position: absolute;
            left: 16px;
            bottom: 16px;
            z-index: 2;
            font-family: var(--mono);
            font-size: 9.5px;
            letter-spacing: .14em;
            text-transform: uppercase;
            color: #fff;
            background: rgba(23, 18, 38, .5);
            border: 1px solid rgba(255, 255, 255, .28);
            backdrop-filter: blur(6px);
            padding: 7px 11px;
            border-radius: 999px;
        }

        /* ---------- plans ---------- */
        .plans__grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: clamp(12px, 2vw, 22px);
            position: relative;
            z-index: 1;
        }

        .plan {
            background: var(--white);
            border: 1px solid var(--line);
            border-radius: var(--r-lg);
            padding: 26px 24px 24px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            position: relative;
            overflow: hidden;
            transition: transform .35s cubic-bezier(.2, .8, .2, 1), box-shadow .35s, border-color .35s;
        }

        .plan::before {
            content: "";
            position: absolute;
            width: 160px;
            height: 160px;
            border-radius: 50%;
            background: var(--disc);
            right: -90px;
            top: -90px;
            opacity: .35;
            pointer-events: none;
        }

        .plan:hover {
            transform: translateY(-7px);
            box-shadow: 0 30px 60px -34px rgba(23, 18, 38, .35);
            border-color: transparent
        }

        .plan>* {
            position: relative;
            z-index: 1
        }

        .plan__tag {
            font-family: var(--mono);
            font-size: 11px;
            letter-spacing: .14em;
            text-transform: uppercase;
            color: var(--pink)
        }

        .plan__price {
            display: flex;
            align-items: baseline;
            flex-wrap: wrap;
            gap: 2px;
            line-height: 1
        }

        .plan__cur {
            font-family: var(--statement);
            font-weight: 600;
            font-size: 1.05rem;
            color: var(--muted);
            margin-right: 2px
        }

        .plan__val {
            font-family: var(--statement);
            font-weight: 700;
            font-size: clamp(2.4rem, 4vw, 3.1rem);
            letter-spacing: -.045em;
            background: var(--grad);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .plan__cents {
            font-family: var(--statement);
            font-weight: 700;
            font-size: 1.15rem;
            color: var(--ink);
            align-self: flex-start;
            margin-top: 6px
        }

        .plan__per {
            width: 100%;
            font-family: var(--mono);
            font-size: 10.5px;
            letter-spacing: .1em;
            color: var(--muted);
            text-transform: uppercase;
            margin-top: 4px
        }

        .plan p {
            font-size: .92rem;
            color: var(--muted);
            line-height: 1.55;
            margin: 0
        }

        .plan__pay {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: auto;
            padding-top: 8px
        }

        .plan__pay span {
            font-family: var(--mono);
            font-size: 9.5px;
            letter-spacing: .08em;
            text-transform: uppercase;
            color: var(--purple);
            border: 1px solid rgba(75, 22, 232, .22);
            background: rgba(230, 220, 253, .35);
            border-radius: 999px;
            padding: 5px 9px;
        }

        .plan .btn {
            width: 100%;
            padding: 12px 14px;
            font-size: 10.5px;
            margin-top: 4px
        }

        .plan--day {
            grid-column: 1 / -1;
            display: grid;
            grid-template-columns: 1.25fr .75fr;
            align-items: center;
            gap: clamp(18px, 3vw, 36px);
            padding: clamp(26px, 3.4vw, 38px);
            background: linear-gradient(135deg, #fff 0%, #fff 55%, rgba(249, 207, 228, .45) 100%);
            border-color: rgba(244, 22, 124, .18);
        }

        .plan--day::before {
            width: 300px;
            height: 300px;
            right: -120px;
            top: -140px;
            opacity: .55
        }

        .plan--day h3 {
            font-family: var(--statement);
            font-weight: 600;
            font-size: clamp(1.4rem, 2.6vw, 1.9rem);
            letter-spacing: -.025em;
            line-height: 1.1;
            margin: 6px 0 8px
        }

        .plan--day h3 em {
            font-family: var(--serif);
            font-style: italic;
            color: var(--pink)
        }

        .plan--day .plan__price {
            justify-content: flex-start
        }

        .plan--day .plan__val {
            font-size: clamp(3rem, 6vw, 4.2rem)
        }

        .plan--day .plan__pay {
            margin-top: 0
        }

        .plan--day .btn {
            width: auto;
            align-self: flex-start;
            margin-top: 12px
        }

        .plans__foot {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: clamp(14px, 2vw, 22px);
            margin-top: clamp(22px, 3vw, 32px);
            position: relative;
            z-index: 1;
        }

        .plan__panel {
            border-radius: var(--r-lg);
            padding: clamp(26px, 3vw, 36px);
            position: relative;
            overflow: hidden;
        }

        .plan__panel--dark {
            background: var(--ink);
            color: #fff
        }

        .plan__panel--dark::before {
            content: "";
            position: absolute;
            width: 280px;
            height: 280px;
            border-radius: 50%;
            background: var(--disc);
            right: -110px;
            bottom: -150px;
            opacity: .5
        }

        .plan__panel--dark .label {
            color: rgba(255, 255, 255, .7)
        }

        .plan__panel--dark .label::before {
            background: #fff
        }

        .plan__panel--dark h3 {
            font-family: var(--statement);
            font-weight: 600;
            font-size: clamp(1.5rem, 2.8vw, 2.1rem);
            line-height: 1.1;
            letter-spacing: -.025em;
            margin: 12px 0 8px;
            position: relative;
            z-index: 1
        }

        .plan__panel--dark h3 em {
            font-family: var(--serif);
            font-style: italic;
            color: var(--blush)
        }

        .plan__panel--dark p {
            color: rgba(255, 255, 255, .76);
            max-width: 38ch;
            position: relative;
            z-index: 1
        }

        .plan__panel--dark .btn {
            background: #fff;
            color: var(--ink);
            border-color: transparent;
            margin-top: 18px;
            position: relative;
            z-index: 1
        }

        .plan__panel--dark .btn:hover {
            box-shadow: 4px 4px 0 0 rgba(255, 255, 255, .35)
        }

        .plan__panel--light {
            background: var(--white);
            border: 1px solid var(--line)
        }

        .plan__panel--light h3 {
            font-family: var(--statement);
            font-weight: 600;
            font-size: clamp(1.4rem, 2.4vw, 1.8rem);
            letter-spacing: -.025em;
            line-height: 1.15;
            margin: 12px 0 10px
        }

        .plan__panel--light p {
            color: var(--muted);
            font-size: .95rem;
            margin-bottom: 8px
        }

        .plan__panel--light a {
            font-family: var(--mono);
            font-size: 11px;
            letter-spacing: .08em;
            text-decoration: none;
            border-bottom: 1px solid var(--pink)
        }

        .plan__methods {
            display: flex;
            flex-wrap: wrap;
            gap: 7px;
            margin-top: 14px
        }

        .plan__methods span {
            font-family: var(--mono);
            font-size: 10px;
            letter-spacing: .08em;
            text-transform: uppercase;
            border: 1px solid rgba(75, 22, 232, .22);
            border-radius: 999px;
            padding: 6px 10px;
            color: var(--purple);
            background: rgba(230, 220, 253, .3);
        }

        /* ---------- lightbox + toast ---------- */
        .lightbox {
            position: fixed;
            inset: 0;
            z-index: 100;
            display: none;
            place-items: center;
            padding: clamp(18px, 4vw, 48px);
            background: rgba(23, 18, 38, .93);
            backdrop-filter: blur(6px);
        }

        .lightbox.is-open {
            display: grid
        }

        .lightbox img {
            max-width: min(1080px, 94vw);
            max-height: 86vh;
            width: auto;
            height: auto;
            border-radius: 16px;
            box-shadow: 0 40px 100px -30px rgba(0, 0, 0, .8);
        }

        .lightbox__close {
            position: absolute;
            top: 18px;
            right: 20px;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, .35);
            background: rgba(255, 255, 255, .1);
            color: #fff;
            font-size: 24px;
            line-height: 1;
            cursor: pointer;
            display: grid;
            place-items: center;
            transition: background .2s;
        }

        .lightbox__close:hover {
            background: rgba(255, 255, 255, .22)
        }

        .toast {
            position: fixed;
            left: 50%;
            bottom: 28px;
            z-index: 110;
            transform: translate(-50%, 20px);
            background: var(--ink);
            color: #fff;
            font-family: var(--mono);
            font-size: 11.5px;
            letter-spacing: .04em;
            padding: 14px 20px;
            border-radius: 999px;
            box-shadow: 0 20px 50px -20px rgba(0, 0, 0, .5);
            opacity: 0;
            pointer-events: none;
            transition: opacity .3s, transform .3s;
            max-width: calc(100vw - 32px);
            text-align: center;
        }

        .toast.is-on {
            opacity: 1;
            transform: translate(-50%, 0)
        }

        /* ---------- founder portraits (duo) ---------- */
        .founders--duo {
            grid-template-columns: repeat(2, 1fr);
            gap: clamp(26px, 4vw, 52px)
        }

        .founder__frame {
            position: relative;
            border-radius: var(--r-lg);
            overflow: hidden;
            aspect-ratio: 4 / 5;
            background: var(--lilac);
            box-shadow: 0 26px 60px -38px rgba(75, 22, 232, .55);
        }

        .founder__frame::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, transparent 62%, rgba(23, 18, 38, .38) 100%);
            pointer-events: none;
        }

        .founder__frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center 22%;
            transition: transform .7s cubic-bezier(.2, .8, .2, 1);
        }

        .founder:hover .founder__frame img {
            transform: scale(1.04)
        }

        .founder__badge {
            position: absolute;
            left: 16px;
            bottom: 16px;
            z-index: 2;
            font-family: var(--mono);
            font-size: 9.5px;
            letter-spacing: .14em;
            text-transform: uppercase;
            color: #fff;
            background: rgba(23, 18, 38, .45);
            border: 1px solid rgba(255, 255, 255, .28);
            backdrop-filter: blur(6px);
            padding: 7px 11px;
            border-radius: 999px;
        }

        /* ---------- responsive ---------- */
        @media (max-width:1200px) {
            .hero .x__cut {
                --h: clamp(440px, 68vh, 760px)
            }
        }

        @media (max-width:960px) {

            .hero__grid,
            .split,
            .sig,
            .mf {
                grid-template-columns: 1fr
            }

            .ct__stack {
                margin-top: clamp(28px, 5vw, 48px)
            }

            .ct__stack .x__blob {
                width: 62%;
                bottom: 0
            }

            .ct__detail {
                right: -2%;
                bottom: -6%;
                width: 42%
            }

            .pillars,
            .founders {
                grid-template-columns: 1fr 1fr
            }

            .hero {
                min-height: auto;
                padding: 112px 0 8px
            }

            .hero__media {
                order: 0;
                justify-content: center;
                margin: 6px 0 0
            }

            .hero__grid {
                padding-right: clamp(24px, 4vw, 72px)
            }

            .vid__arc {
                display: none
            }

            .hero .x__cut {
                --h: clamp(380px, 56vh, 560px)
            }

            .founder .x__cut {
                --h: clamp(210px, 25vh, 290px)
            }


            .nav__links {
                display: none
            }

            .foot__arc {
                width: 240px;
                height: 240px;
                right: -70px
            }
        }

        @media (max-width:620px) {

            .pillars,
            .founders {
                grid-template-columns: 1fr
            }

            .sig__row {
                grid-template-columns: 1fr;
                gap: 4px
            }

            .hero {
                padding-top: 118px
            }

            .sticky-cta {
                display: block
            }

            body {
                padding-bottom: 0
            }

            .site-footer {
                padding-bottom: 96px
            }
        }

        @media (max-width:960px) {
            .plans__grid {
                grid-template-columns: repeat(2, 1fr)
            }

            .plans__foot {
                grid-template-columns: 1fr
            }

            .plan--day {
                grid-template-columns: 1fr
            }

            .plan--day .btn {
                width: 100%
            }
        }

        @media (max-width:620px) {
            .plans__grid {
                grid-template-columns: 1fr
            }

            .founders--duo {
                grid-template-columns: 1fr
            }

            .plan--day {
                padding: 24px 20px
            }

            .plan__panel {
                padding: 26px 22px
            }

            .lightbox__close {
                top: 12px;
                right: 12px
            }

            .toast {
                bottom: 86px
            }
        }

        @media (prefers-reduced-motion:reduce) {
            * {
                animation: none !important;
                transition-duration: .01ms !important
            }

            /* a faixa continua girando (mais devagar): e o pedido do cliente */
            .marquee__track {
                animation: slide 52s linear infinite !important
            }

            .js .rv {
